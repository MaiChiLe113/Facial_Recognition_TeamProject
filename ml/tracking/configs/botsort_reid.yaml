# Hawkeye copy of Ultralytics botsort.yaml (ultralytics 8.4.215). Changes from the default:
#   track_buffer 30 -> 90  (~3 s at 30 fps, same as bytetrack_long.yaml)
#   gmc_method sparseOptFlow -> none  (the cameras do not move)
#   with_reid True  (appearance re-identification from the detector's own features, model: auto; no extra download)
# Docs: https://docs.ultralytics.com/modes/track

tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 90
match_thresh: 0.8
fuse_score: True
gmc_method: none
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: True
model: auto
